<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdia Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
     <div class="container">

        <div class="form-box login">
            <form id="login-form">

                <h1>Đăng nhập</h1>

                <div class="input-box">
                    <input type="text" name="login" id="login-username" placeholder="Tên đăng nhập" required>
                    <i class='bx bxs-user'></i>
                </div>

                <div class="input-box">
                    <input type="password" name="password" id="login-password" placeholder="Mật khẩu" required>
                    <i class='bx bxs-hide toggle-password' data-target="login-password"></i>
                </div>

                <div class="login-options">

                    <label class="remember-account">
                        <input type="checkbox" id="remember-account">
                        <span>Nhớ tài khoản</span>
                    </label>

                    <div class="forgot-link">
                        <a href="#">Quên mật khẩu?</a>
                    </div>

                </div>

                <button type="submit" class="btn">
                    Đăng nhập
                </button>

                <p>Hoặc đăng nhập bằng</p>

                <div class="social-icons">
                    <a href="/api/users/auth/google">
                        <i class='bx bxl-google'></i>
                    </a>

                    <a href="/api/users/auth/facebook">
                        <i class='bx bxl-facebook'></i>
                    </a>
                </div>

            </form>
        </div>

        <div class="form-box register">
            <form id="register-form">

                <h1>Đăng ký</h1>

                <div class="input-box">
                    <input type="text" name="full_name" placeholder="Họ và tên" required>
                    <i class='bx bxs-id-card'></i>
                </div>

                <div class="input-box">
                    <input type="text" name="username" placeholder="Tên đăng nhập" required>
                    <i class='bx bxs-user'></i>
                </div>

                <div class="input-box">
                    <input type="email" name="email" placeholder="Email" required>
                    <i class='bx bxs-envelope'></i>
                </div>

                <div class="input-box">
                    <input type="text" name="phone_num" placeholder="Số điện thoại" required>
                    <i class='bx bxs-phone'></i>
                </div>

                <div class="input-box">
                    <input type="text" name="address" placeholder="Địa chỉ" required>
                    <i class='bx bxs-map'></i>
                </div>

                <div class="input-box">
                    <input type="password" name="password" id="register-password" placeholder="Mật khẩu" required>
                    <i class='bx bxs-hide toggle-password' data-target="register-password"></i>
                </div>

                <div class="input-box">
                    <input type="password" name="confirm_password" id="confirm-password" placeholder="Xác nhận mật khẩu"
                        required>
                    <i class='bx bxs-hide toggle-password' data-target="confirm-password"></i>
                </div>

                <button type="submit" class="btn">
                    Đăng ký
                </button>

                <p>Hoặc đăng ký bằng</p>

                <div class="social-icons">
                    <a href="/api/users/auth/google">
                        <i class='bx bxl-google'></i>
                    </a>

                    <a href="/api/users/auth/facebook">
                        <i class='bx bxl-facebook'></i>
                    </a>
                </div>

            </form>
        </div>

        <div class="toggle-box">

            <div class="toggle-panel toggle-left">
                <h1>Welcom back!</h1>
                <p>Bạn chưa có tài khoản?</p>

                <button class="btn register-btn">
                    Đăng ký
                </button>
            </div>

            <div class="toggle-panel toggle-right">
                <h1>Hi, Welcome!</h1>
                <p>Bạn đã có tài khoản?</p>

                <button class="btn login-btn">
                    Đăng nhập
                </button>
            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Verdia Merchandise
        {% endblock %}
    </title>

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">

    {% block extra_css %}
    {% endblock %}

</head>


<body>

    <header class="header shared-header">

        <a href="/" class="logo">

            <img src="{{ url_for('static', filename='images/logo/logo_verdia.png') }}" alt="Verdia Merchandise">

        </a>


        {% block header_content %}

        <nav class="navbar" id="navbar">

            <a href="/" class="{% if request.path == '/' %}active{% endif %}">
                Trang chủ
            </a>


            <a href="/products" class="{% if request.path == '/products' %}active{% endif %}">
                Sản phẩm
            </a>


            <a href="/about" class="{% if request.path == '/about' %}active{% endif %}">
                About Verdia
            </a>

        </nav>

        <div class="header-actions">

            <a href="/cart" class="
                    header-icon
                    {% if request.path == '/cart' %}
                    active
                    {% endif %}
                " title="Giỏ hàng">

                <i class='bx bx-cart'></i>

            </a>

            <div class="notification-wrapper" id="notification-wrapper" style="display: none;">

                <button type="button" class="header-icon notification-btn" id="notification-btn" title="Thông báo">

                    <i class='bx bx-bell'></i>


                    <span class="notification-count" id="notification-count" style="display: none;">
                        0
                    </span>

                </button>

                <div class="notification-dropdown" id="notification-dropdown">

                    <div class="notification-dropdown-header">

                        <div>

                            <p>
                                VERDIA UPDATE
                            </p>

                            <h3>
                                Thông báo
                            </h3>

                        </div>

                    </div>


                    <div class="notification-list" id="notification-list">

                        <div class="notification-empty">

                            <i class='bx bx-bell'></i>

                            <p>
                                Chưa có thông báo
                            </p>

                        </div>

                    </div>


                    <a href="/profile?tab=preorder-orders" class="notification-view-all">

                        Xem đơn hàng Pre-order

                        <i class='bx bx-right-arrow-alt'></i>

                    </a>

                </div>

            </div>

            <div id="auth-nav">

                <a href="/login" class="login-btn-nav" id="login-nav-btn">
                    Đăng nhập
                </a>


                <a href="/profile" class="header-icon user-icon-btn" id="profile-nav-btn" title="Tài khoản cá nhân"
                    style="display: none;">

                    <i class='bx bx-user'></i>

                </a>

            </div>

        </div>


        {% endblock %}

    </header>

    {% block content %}
    {% endblock %}

    {% block extra_js %}
    {% endblock %}


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const token =
                    localStorage.getItem(
                        "access_token"
                    );


                const loginBtn =
                    document.getElementById(
                        "login-nav-btn"
                    );


                const profileBtn =
                    document.getElementById(
                        "profile-nav-btn"
                    );


                const notificationWrapper =
                    document.getElementById(
                        "notification-wrapper"
                    );

                if (token) {

                    loginBtn.style.display =
                        "none";

                    profileBtn.style.display =
                        "flex";

                    notificationWrapper.style.display =
                        "block";


                    loadNotifications();

                } else {

                    loginBtn.style.display =
                        "inline-flex";

                    profileBtn.style.display =
                        "none";

                    notificationWrapper.style.display =
                        "none";

                }

            }
        );

        const notificationBtn =
            document.getElementById(
                "notification-btn"
            );


        const notificationDropdown =
            document.getElementById(
                "notification-dropdown"
            );


        const notificationList =
            document.getElementById(
                "notification-list"
            );


        const notificationCount =
            document.getElementById(
                "notification-count"
            );

        notificationBtn?.addEventListener(
            "click",
            event => {

                event.stopPropagation();


                notificationDropdown
                    ?.classList
                    .toggle(
                        "show"
                    );

            }
        );


        document.addEventListener(
            "click",
            event => {

                const wrapper =
                    document.getElementById(
                        "notification-wrapper"
                    );


                if (
                    wrapper
                    &&
                    !wrapper.contains(
                        event.target
                    )
                ) {

                    notificationDropdown
                        ?.classList
                        .remove(
                            "show"
                        );

                }

            }
        );

        async function loadNotifications() {

            const token =
                localStorage.getItem(
                    "access_token"
                );


            if (!token) {
                return;
            }


            try {

                const response =
                    await fetch(
                        "/api/notifications/me",
                        {

                            method:
                                "GET",

                            headers: {

                                Authorization:
                                    `Bearer ${token}`

                            }

                        }
                    );


                if (!response.ok) {

                    console.error(
                        "Không thể tải thông báo:",
                        response.status
                    );

                    return;
                }


                const result =
                    await response.json();


                console.log(
                    "NOTIFICATIONS:",
                    result
                );


                const notifications =
                    result.data?.notifications
                    ||
                    result.notifications
                    ||
                    [];


                renderNotifications(
                    notifications
                );


                updateNotificationCount(
                    notifications.length
                );


            } catch (error) {

                console.error(
                    "LOAD NOTIFICATIONS ERROR:",
                    error
                );

            }

        }

        function renderNotifications(
            notifications
        ) {

            if (!notificationList) {
                return;
            }


            if (!notifications.length) {

                notificationList.innerHTML = `

                <div class="notification-empty">

                    <i class='bx bx-bell'></i>

                    <p>
                        Chưa có thông báo
                    </p>

                </div>

            `;


                return;
            }


            notificationList.innerHTML =
                notifications

                    .slice(
                        0,
                        8
                    )

                    .map(
                        notification =>
                            createNotificationHTML(
                                notification
                            )
                    )

                    .join("");

        }

        function createNotificationHTML(
            notification
        ) {

            return `

            <a
                href="/profile?tab=preorder-orders"
                class="notification-item"
            >

                <div class="notification-item-icon">

                    <i class='bx bx-time-five'></i>

                </div>


                <div class="notification-item-content">

                    <strong>
                        ${escapeNotificationHTML(
                notification.title
            )}
                    </strong>


                    <p>
                        ${escapeNotificationHTML(
                notification.message
            )}
                    </p>


                    <span>
                        ${formatNotificationDate(
                notification.created_at
            )}
                    </span>

                </div>

            </a>

        `;

        }

        function updateNotificationCount(
            count
        ) {

            if (!notificationCount) {
                return;
            }


            if (
                !count
                ||
                count <= 0
            ) {

                notificationCount.style.display =
                    "none";

                notificationCount.textContent =
                    "0";

                return;
            }


            notificationCount.style.display =
                "flex";


            notificationCount.textContent =
                count > 99
                    ? "99+"
                    : String(
                        count
                    );

        }

        function formatNotificationDate(
            value
        ) {

            if (!value) {
                return "";
            }


            const date =
                new Date(
                    value
                );


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "";

            }


            return date.toLocaleString(
                "vi-VN",
                {

                    day:
                        "2-digit",

                    month:
                        "2-digit",

                    year:
                        "numeric",

                    hour:
                        "2-digit",

                    minute:
                        "2-digit"

                }
            );

        }

        function escapeNotificationHTML(value) {

            return String(
                value || ""
            )

                .replaceAll(
                    "&",
                    "&amp;"
                )

                .replaceAll(
                    "<",
                    "&lt;"
                )

                .replaceAll(
                    ">",
                    "&gt;"
                )

                .replaceAll(
                    '"',
                    "&quot;"
                )

                .replaceAll(
                    "'",
                    "&#039;"
                );

        }

    </script>
